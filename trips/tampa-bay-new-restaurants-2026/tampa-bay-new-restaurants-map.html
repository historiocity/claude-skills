/* Layout: one reading column; the comparison table and the bay map get the full width. */
:root{
  --paper:#f4f6f5; --card:#ffffff; --ink:#18232a; --muted:#5a6a72; --line:#d9e0e0;
  --bay:#0f5a6b; --bay-soft:#e2eef0; --ember:#b8562e; --ember-soft:#f6e6dc;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --bay:#6fc3d1; --bay-soft:#173339; --ember:#f08a5d; --ember-soft:#3a2419;

:root[data-theme="dark"]{

  --water:#0e2a33; --land:#1d2a2f; --landline:#3c5158; color-scheme:dark }

html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--body)}
body{display:flex;flex-direction:column}
.bar{padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--card)}
.bar h1{font:400 26px/1 var(--display);margin:0}
.bar ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding:0}
.bar a{color:var(--ink);font-weight:600}
.qs{font:700 12px/1 var(--mono);color:var(--ember)}
.where{color:var(--muted);font-size:12px}

.map-shell{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--water)}
.map-shell #map{height:min(70vh,620px);width:100%;background:var(--water)}
.map-shell.full{position:fixed;inset:0;z-index:2000;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.map-shell.full #map{height:100%}
.map-btn{position:absolute;top:12px;right:12px;z-index:1000;font:600 13px/1 var(--body);padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.map-shell.full .map-btn{top:calc(12px + env(safe-area-inset-top,0px))}
.map-btn:focus-visible{outline:2px solid var(--bay);outline-offset:2px}
.pin{display:grid;place-items:center;width:38px;height:38px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--ember);border:2px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);font:700 12px/1 var(--mono);color:#fff}
.pin-label{font:600 12px/1.2 var(--body);color:var(--ink);background:var(--card);padding:3px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-popup-content{margin:14px 16px;font:14px/1.45 var(--body);min-width:230px}
.pop h4{margin:0 0 2px;font:400 22px/1.1 var(--display)}
.pop .r{font:700 12px/1 var(--mono);color:var(--ember);letter-spacing:.04em;text-transform:uppercase}
.pop p{margin:8px 0}
.pop .links{display:flex;gap:12px;flex-wrap:wrap}
.pop a{color:var(--bay);font-weight:600}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bar a{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}

.map-shell{flex:1;border:0;border-radius:0}
